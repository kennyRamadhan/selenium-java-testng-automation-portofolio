name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/v2]

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Compile main + test sources
        run: mvn -B clean compile test-compile

  api-smoke:
    name: API Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run API smoke tests
        run: mvn -B test -P api -Dgroups=smoke

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 7

  web-smoke:
    name: Web Smoke (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run web smoke tests (headless)
        run: mvn -B test -P web -Dgroups=smoke -Dheadless=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: target/allure-results
          retention-days: 7

  mobile-smoke:
    name: Mobile Smoke (Android emulator API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Soft mode: the mvn invocation inside the emulator-runner script uses
    # `|| true` so CI stays green regardless of test outcomes. Pass/fail
    # is visible in the Allure dashboard. Tightening to strict mode is
    # planned once the 2 post-v2.1.0 deferred fixes (sortingPrice,
    # checkoutPositiveFlow) ship.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium 3 + UiAutomator2 driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      # Phase 7: provision SwagLabs APK at runtime instead of from git.
      # Layered idempotency — cache restores the APK on warm runs, curl
      # repopulates on cache miss, and the Java ApkDownloader inside the
      # test JVM is the final safety net if both fail.
      - name: Cache SwagLabs APK
        uses: actions/cache@v4
        with:
          path: apps/swaglabs-2.7.1.apk
          key: swaglabs-apk-v2.7.1

      - name: Download SwagLabs APK (cache miss)
        run: |
          mkdir -p apps
          if [ ! -s apps/swaglabs-2.7.1.apk ]; then
            curl -fL -o apps/swaglabs-2.7.1.apk \
              https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The reactivecircus action owns the emulator lifecycle: boot, wait,
      # run script, shutdown. The mvn invocation lives INSIDE the action's
      # `script:` param so it executes against the running emulator.
      # Specs adapted from the UCO Collect production mobile CI proven
      # viable on ubuntu-latest 7GB runners.
      - name: Run mobile tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics -cores 1 -memory 2048
          disable-animations: true
          script: mvn -B test || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: target/allure-results
          retention-days: 7
