name: Allure Report Publish
# Publishes the Allure report to gh-pages on every push to main.
# Manual workflow_dispatch trigger lets you regenerate or run a specific suite.
#
# One-time manual setup required:
#   Repo Settings → Pages → Source: gh-pages branch
#
# After first publish, the report is served at:
#   https://kennyRamadhan.github.io/selenium-java-testng-automation-portofolio/

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options:
          - all
          - api
          - web
          - mobile
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

# One publish run at a time per ref to avoid gh-pages history collisions.
concurrency:
  group: allure-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-allure:
    name: Generate and publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          wget -q -O allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz -C $HOME
          sudo ln -sf $HOME/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure --version

      - name: Run API suite
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'api' }}
        run: mvn -B test -P api || true

      - name: Run Web suite (headless Chrome)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'web' }}
        run: mvn -B test -P web -Dheadless=true || true

      # Mobile suite — Android emulator via reactivecircus/android-emulator-runner.
      # The action owns emulator lifecycle and runs `mvn -B test || true` inside
      # its `script:` param against the booted emulator. Node + Appium + KVM
      # setup steps run beforehand at the publish-allure job level, each gated
      # by the same Mobile-suite condition so they're no-ops when only API or
      # Web is selected via workflow_dispatch.
      - name: Setup Node 20 (mobile)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium 3 + UiAutomator2 driver (mobile)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      # Phase 7: provision SwagLabs APK at runtime; layered with Java ApkDownloader.
      - name: Cache SwagLabs APK (mobile)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        uses: actions/cache@v4
        with:
          path: apps/swaglabs-2.7.1.apk
          key: swaglabs-apk-v2.7.1

      - name: Download SwagLabs APK (cache miss, mobile)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        run: |
          mkdir -p apps
          if [ ! -s apps/swaglabs-2.7.1.apk ]; then
            curl -fL -o apps/swaglabs-2.7.1.apk \
              https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
          fi

      - name: Enable KVM (mobile)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Mobile suite (Android emulator API 30)
        if: ${{ github.event_name == 'push' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'mobile' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics -cores 1 -memory 2048
          disable-animations: true
          script: mvn -B test || true

      - name: Checkout existing gh-pages history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history from gh-pages
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Generate Allure report
        if: always()
        run: |
          rm -rf allure-history
          allure generate target/allure-results --clean -o allure-history

      - name: Deploy to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
