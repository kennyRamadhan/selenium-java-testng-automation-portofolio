# ===== Mobile target (Phase 3) — Android default =====
# Android is the active platform for active execution (Windows + Android Studio
# emulator dev environment). iOS values preserved as opt-in block at bottom of
# this file.
platformName=Android
automationName=UiAutomator2
deviceName=Android Emulator
appPackage=com.swaglabsmobileapp
appActivity=com.swaglabsmobileapp.SplashActivity
app=src/test/resources/apps/appTest.apk
noReset=true
fullReset=false

# API target (Phase 5)
api.baseUrl=https://automationexercise.com
api.timeout.seconds=30

# Web target (Phase 4)
web.baseUrl=https://automationexercise.com
web.timeout.seconds=15
web.default.browser=chrome

# ===== iOS opt-in block (uncomment + comment out the Android block above to use) =====
# Requires macOS + Xcode + iOS Simulator. The iosSimulator.app fixture lives at
# src/test/resources/apps/iosSimulator.app. Set UDID via environment variable.
# platformName=iOS
# automationName=XCUITest
# deviceName=iPhone 15
# platformVersion=17.5
# bundleId=com.saucelabs.SwagLabsMobileApp
# udid=${UDID}
# wdaLocalPort=8000
# wdaLaunchTimeout=60000
# wdaStartupRetries=4
# wdaStartupRetryInterval=200000
# useNewWda=false
# preventWDAAttachments=true
